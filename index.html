  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"

  <script>
    // Configure Tailwind to use class-based dark mode
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    };

    // Prevent flash of light mode
    (function () {
      try {
        const theme = localStorage.getItem('civicflow-theme');
        const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (theme === null && supportDarkMode)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        // Restore high-contrast mode
        if (localStorage.getItem('civicflow-contrast') === 'high') {
          document.documentElement.classList.add('high-contrast');
        }
      } catch (e) { }
    })();
  </script>
</head>
